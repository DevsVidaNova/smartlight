<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login Admin</title>
    <style>
      body {
        font-family: system-ui, Arial;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f6f7f9;
      }
      form {
        background: #fff;
        padding: 24px;
        border: 1px solid #ddd;
        border-radius: 8px;
        width: 320px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-size: 13px;
        color: #222;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 6px;
        background: #0a7;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #086;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <h1>Login de Administrador</h1>
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" required />
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required />
      <button type="submit">Entrar</button>
    </form>
  </body>
</html>
